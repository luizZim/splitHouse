<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Split House — Instalação e Manutenção de Ar Condicionado em Cascavel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
/* ── RESET ─────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'Poppins', sans-serif; background: #fff; color: #1A1A2E; -webkit-font-smoothing: antialiased; }
a { text-decoration: none; color: inherit; }
img { max-width: 100%; display: block; }
input, select, textarea, button { font-family: 'Poppins', sans-serif; }

/* ── CONTAINER ─────────────────────────────────────── */
.container {
  width: 100%;
  max-width: 1200px;
  margin-inline: auto;
  padding-inline: 24px;
}

/* ── HIDE SCROLLBAR ON TESTIMONIALS ───────────────── */
.testimonials-scroll::-webkit-scrollbar { display: none; }
.testimonials-scroll { -ms-overflow-style: none; scrollbar-width: none; }

/* ── MOBILE BREAKPOINTS ────────────────────────────── */
@media (max-width: 900px) {
  .nav-links-desktop { display: none !important; }
  .nav-mobile-toggle { display: block !important; }
  .hero-visual { display: none !important; }
  .hero-mascot { display: none !important; }
  .services-grid-4 { grid-template-columns: 1fr 1fr !important; }
  .stats-grid-4 { grid-template-columns: 1fr 1fr !important; }
  .products-grid-3 { grid-template-columns: 1fr 1fr !important; }
  .about-grid { grid-template-columns: 1fr !important; }
  .about-story-grid { grid-template-columns: 1fr !important; }
  .diferenciais-grid { grid-template-columns: 1fr 1fr !important; }
  .contato-grid { grid-template-columns: 1fr !important; }
  .sim-grid { grid-template-columns: 1fr !important; }
  .result-stats { flex-direction: column !important; }
  .footer-grid { grid-template-columns: 1fr 1fr !important; }
  .product-detail-grid { grid-template-columns: 1fr !important; }
  .service-detail-grid { grid-template-columns: 1fr !important; }
}
@media (max-width: 560px) {
  .services-grid-4 { grid-template-columns: 1fr !important; }
  .products-grid-3 { grid-template-columns: 1fr !important; }
  .diferenciais-grid { grid-template-columns: 1fr !important; }
  .footer-grid { grid-template-columns: 1fr !important; }
  .stats-grid-4 { grid-template-columns: 1fr 1fr !important; }
}

/* ── HOVER CARDS ───────────────────────────────────── */
.product-hover-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 32px rgba(46,49,146,.14) !important;
}
.footer-link:hover { color: #F7941D !important; }
.nav-cta-btn:hover { background: #1ebe5a !important; box-shadow: 0 4px 16px rgba(37,211,102,.35) !important; transform: translateY(-1px) !important; }

/* ── TWEAKS PANEL OFFSET ───────────────────────────── */
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}
.section-animate { animation: fadeInUp .4s ease-out both; }
</style>
</head>
<body>

<div id="root"></div>

<!-- Component files -->
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="components/App.jsx"></script>
<script type="text/babel" src="components/HomePage.jsx"></script>
<script type="text/babel" src="components/ExtraPages.jsx"></script>

<!-- Main app bootstrap -->
<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "primaryColor": "#2E3192",
  "accentColor": "#F7941D",
  "heroHeadline": "Instalação e Manutenção de Ar Condicionado Sem Complicação",
  "phone": "(45) 9 9999-0000",
  "showSimulator": true,
  "showDiagnostic": true
}/*EDITMODE-END*/;

function Root() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  window.__tweaksCtx = { tweaks: t, setTweak };

  return (
    <React.Fragment>
      <App />
      <TweaksPanel>
        <TweakSection label="Cores" />
        <TweakColor label="Azul primário" value={t.primaryColor} onChange={v => {
          setTweak('primaryColor', v);
          document.documentElement.style.setProperty('--blue', v);
        }} />
        <TweakColor label="Laranja (CTA)" value={t.accentColor} onChange={v => setTweak('accentColor', v)} />
        <TweakSection label="Conteúdo" />
        <TweakText label="Headline do Hero" value={t.heroHeadline} onChange={v => setTweak('heroHeadline', v)} />
        <TweakText label="Telefone / WhatsApp" value={t.phone} onChange={v => setTweak('phone', v)} />
        <TweakSection label="Seções" />
        <TweakToggle label="Mostrar Simulador BTU" value={t.showSimulator} onChange={v => setTweak('showSimulator', v)} />
        <TweakToggle label="Mostrar Diagnóstico" value={t.showDiagnostic} onChange={v => setTweak('showDiagnostic', v)} />
      </TweaksPanel>
    </React.Fragment>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<Root />);
</script>
</body>
</html>
